   # image: pandanxt/hrm-dashboard:1.0.1
   # ports:
   #   - "6001:80"
   # container_name: hrm-dashboard
   # restart: always
   # environment:
   #   HRM_BACKEND_URL: "http://hrm-mongo-apis:5000"
    #  DEFAULT_USER_ICON: "https://file-hrm.nxtwebmasters.com/images/default-user.webp"
   # depends_on:
   #   mongodb:
   #     condition: service_healthy
   # networks:
   #   - internal_net

  # HRM BACKEND API
  hrm-mongo-apis:
    image: pandanxt/nxt-hrm-backend:staging-1.0.0
    ports:
      - "5000:5000"  # Changed from 80 to match your config
    container_name: hrm-mongo-apis
    restart: always
    env_file:
      - hrm-backend.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]  # Changed port to 5000
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - internal_net

  # MongoDB Service
  mongodb:
    image: mongo:latest
    container_name: hrm-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: Expertflow123  # Change to secure password
      MONGO_INITDB_DATABASE: nxt-hrm
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal_net

volumes:
  mongodb_data:

networks:
  internal_net:
    driver: bridge